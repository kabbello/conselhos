###############################################################################
# Conselhos Municipais — Docker Compose (Production / Swarm)
# Domínio: conselhosmunicipais.app.br
# Servidor: 37.60.231.53
###############################################################################

services:
  db:
    image: mysql:8.0
    env_file: .env
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=$$MYSQL_ROOT_PASSWORD"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256m
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 64m
      restart_policy:
        condition: on-failure

  app:
    image: conselhos-app:latest
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - internal
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 512m
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - app-storage:/var/www/html/storage:ro
    networks:
      - internal
      - Kblotec
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 64m
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.conselhos.rule=Host(`conselhosmunicipais.app.br`)"
        - "traefik.http.routers.conselhos.entrypoints=websecure"
        - "traefik.http.routers.conselhos.tls.certresolver=letsencrypt"
        - "traefik.http.services.conselhos.loadbalancer.server.port=80"
        - "traefik.http.routers.conselhos-http.rule=Host(`conselhosmunicipais.app.br`)"
        - "traefik.http.routers.conselhos-http.entrypoints=web"
        - "traefik.http.routers.conselhos-http.middlewares=redirect-https"
        - "traefik.docker.network=Kblotec"

  queue:
    image: conselhos-app:latest
    env_file: .env
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --memory=256
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 256m
      restart_policy:
        condition: on-failure

  scheduler:
    image: conselhos-app:latest
    env_file: .env
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    volumes:
      - app-storage:/var/www/html/storage
    networks:
      - internal
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 128m
      restart_policy:
        condition: on-failure

volumes:
  app-storage:
    driver: local
  db-data:
    driver: local

networks:
  internal:
    driver: overlay
  Kblotec:
    external: true
